name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 生成物（tokens.css / themes.css / registry.ts / NekoHead / icons.generated / status.json / README）がソースと一致していること。
      # build:themes はコントラスト検査（check:contrast）を含む。--skip-font-check でネットワーク不要
      - run: pnpm build:tokens && pnpm build:themes --skip-font-check && pnpm build:icons && pnpm build:readmes && pnpm build:registry --no-shadcn && git diff --exit-code
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm icons:list
      # next build が next-env.d.ts を生成するので typecheck より先に実行する
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build-storybook
      - run: pnpm build:package
      - run: pnpm build:registry
      - run: pnpm pack:test
