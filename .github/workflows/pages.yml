name: Pages

# デモサイト（Next.js 静的書き出し）＋ Storybook（/storybook/）＋ shadcn registry（/r/）＋ llms.txt を
# https://gp-ryoga-isozumi.github.io/nekodemo-cat-design-system/ に配信する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm build:registry
      # 公開前の導入経路: デモサイトに npm tarball を置く（pnpm add https://.../nekodemo.tgz）
      - run: pnpm build:package && npm pack --pack-destination public && cp public/nekodemo-*.tgz public/nekodemo.tgz
      - run: pnpm build
        env:
          NEXT_BASE_PATH: /nekodemo-cat-design-system
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
